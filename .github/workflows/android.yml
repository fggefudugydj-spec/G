name: LeviLab Android Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build LeviLab APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate or Unzip Project
        id: find_project
        shell: bash
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              mkdir -p _project
              unzip -q "$ZIP_FILE" -d _project
            fi
          fi
          PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "لم يتم العثور على ملفات المشروع (settings.gradle.kts)"
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Fix unused KSP plugin if present
        working-directory: ${{ steps.find_project.outputs.dir }}
        shell: bash
        run: |
          sed -i '/^[[:space:]]*alias(libs\.plugins\.google\.devtools\.ksp)/s/^/\/\/ /' build.gradle.kts app/build.gradle.kts || true

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android Licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug.keystore
        working-directory: ${{ steps.find_project.outputs.dir }}
        shell: bash
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -s "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build LeviLab Debug APK
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload LeviLab APK
        uses: actions/upload-artifact@v4
        with:
          name: LeviLab-debug-apk
          path: ${{ steps.find_project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
